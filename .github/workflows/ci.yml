name: Verify ledger

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: node dist/src/cli.js --json > /tmp/ledger-report.json
      - run: node src/cli.ts > /tmp/replay.txt && diff -u examples/replay.txt /tmp/replay.txt
